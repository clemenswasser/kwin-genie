name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:45
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf -y install \
            cmake gcc gcc-c++ make git \
            extra-cmake-modules kwin-devel kwin \
            qt6-qtbase-devel qt6-qttools \
            kf6-kcoreaddons-devel libdrm-devel \
            dbus-tools appstream python3 libepoxy-devel \
            mesa-dri-drivers mesa-libEGL mesa-libGL libglvnd-egl libglvnd-glx

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        # The matrix tests need a running KWin/OpenGL compositor; run them locally.
        run: ctest --test-dir build --output-on-failure -E 'genie_(target|direction|multioutput|scale|autohide|synth)_matrix'
